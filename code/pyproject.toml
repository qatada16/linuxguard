[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxguard"
version = "0.1.0"
description = "Linux Audit intrusion detection and evidence investigation prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
]

[project.optional-dependencies]
local-ai = ["ollama>=0.6"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["linuxguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
