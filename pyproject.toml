[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxguard"
version = "1.0.0"
description = "Machine learning-assisted Linux intrusion detection and investigation system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Anees Hamid" },
    { name = "Muhammad Qatada" },
    { name = "Aliyan Bajwa" },
]
keywords = ["intrusion-detection", "auditd", "isolation-forest", "linux", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dashboard = ["streamlit>=1.33"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "fastapi>=0.110", "uvicorn>=0.29"]
all = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.33"]

[project.scripts]
linuxguard = "linuxguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linuxguard = ["resources/*.yaml", "resources/rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]
